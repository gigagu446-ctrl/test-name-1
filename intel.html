<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 24px;
      background: #181818;
      border-bottom: 1px solid #2b2b2b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
    }

    .logo {
      width: 40px;
      height: 28px;
      border-radius: 8px;
      background: #ff0000;
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .upload-btn {
      cursor: pointer;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      color: white;
      background: #ff0000;
    }

    .upload-btn:hover { background: #d90000; }

    main {
      width: min(1200px, 94%);
      margin: 30px auto;
    }

    .hero {
      background: linear-gradient(135deg, #242424, #171717);
      padding: 26px;
      border-radius: 18px;
      margin-bottom: 28px;
      border: 1px solid #303030;
    }

    .hero h1 { margin: 0 0 8px; }
    .hero p { margin: 0; color: #bcbcbc; line-height: 1.5; }

    #videoInput { display: none; }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 60px 20px;
      border: 1px dashed #444;
      border-radius: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }

    .card {
      background: #181818;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      overflow: hidden;
      transition: transform .2s ease;
    }

    .card:hover { transform: translateY(-3px); }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: block;
      object-fit: cover;
    }

    .card-info { padding: 14px; }
    .title {
      font-weight: 700;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      flex: 1;
      cursor: pointer;
      border: 0;
      padding: 9px 10px;
      border-radius: 10px;
      font-weight: 700;
    }

    .watch {
      background: #fff;
      color: #111;
    }

    .delete {
      background: #313131;
      color: #fff;
    }

    dialog {
      width: min(900px, 94%);
      border: none;
      border-radius: 18px;
      padding: 0;
      background: #111;
      color: #fff;
    }

    dialog::backdrop {
      background: rgba(0,0,0,.82);
    }

    .player-wrap {
      padding: 16px;
    }

    .player-wrap video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 12px;
    }

    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
    }

    .close {
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      background: #2d2d2d;
      color: #fff;
    }

    @media (max-width: 600px) {
      header { padding: 12px 14px; }
      .brand { font-size: 19px; }
      main { width: 95%; margin-top: 20px; }
      .hero { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">▶</div>
      <span>YouTube Hub</span>
    </div>

    <label class="upload-btn" for="videoInput">+ ვიდეოს ატვირთვა</label>
    <input id="videoInput" type="file" accept="video/*" multiple />
  </header>

  <main>
    <section class="hero">
      <h1>შენი ვიდეო ჰაბი</h1>
      <p>ატვირთე ვიდეოები, შეინახე ამ ბრაუზერში და უყურე პირდაპირ საიტიდან.</p>
    </section>

    <div id="empty" class="empty">
      ჯერ ვიდეო არ არის ატვირთული.<br />
      დააჭირე <b>„ვიდეოს ატვირთვა“</b>-ს.
    </div>

    <section id="videoGrid" class="grid"></section>
  </main>

  <dialog id="playerDialog">
    <div class="player-wrap">
      <div class="player-top">
        <strong id="playerTitle">ვიდეო</strong>
        <button class="close" id="closePlayer">დახურვა ✕</button>
      </div>
      <video id="mainPlayer" controls autoplay></video>
    </div>
  </dialog>

  <script>
    const DB_NAME = "youtubeHubDB";
    const STORE_NAME = "videos";
    let db;

    const input = document.getElementById("videoInput");
    const grid = document.getElementById("videoGrid");
    const empty = document.getElementById("empty");
    const dialog = document.getElementById("playerDialog");
    const player = document.getElementById("mainPlayer");
    const playerTitle = document.getElementById("playerTitle");
    const closePlayer = document.getElementById("closePlayer");

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, {
              keyPath: "id",
              autoIncrement: true
            });
          }
        };

        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };

        request.onerror = () => reject(request.error);
      });
    }

    function addVideo(file) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);

        const data = {
          name: file.name,
          type: file.type,
          size: file.size,
          createdAt: new Date().toISOString(),
          file
        };

        const req = store.add(data);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function getVideos() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();

        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function deleteVideo(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(id);

        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + sizes[i];
    }

    async function renderVideos() {
      const videos = await getVideos();
      grid.innerHTML = "";

      empty.style.display = videos.length ? "none" : "block";

      videos
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .forEach((video) => {
          const url = URL.createObjectURL(video.file);

          const card = document.createElement("article");
          card.className = "card";

          const preview = document.createElement("video");
          preview.className = "thumb";
          preview.src = url;
          preview.muted = true;
          preview.preload = "metadata";

          const info = document.createElement("div");
          info.className = "card-info";

          const title = document.createElement("div");
          title.className = "title";
          title.textContent = video.name;

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent =
            formatBytes(video.size) +
            " • " +
            new Date(video.createdAt).toLocaleString();

          const actions = document.createElement("div");
          actions.className = "actions";

          const watchBtn = document.createElement("button");
          watchBtn.className = "watch";
          watchBtn.textContent = "▶ ყურება";
          watchBtn.onclick = () => {
            player.src = url;
            playerTitle.textContent = video.name;
            dialog.showModal();
            player.play().catch(() => {});
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete";
          deleteBtn.textContent = "წაშლა";
          deleteBtn.onclick = async () => {
            const ok = confirm(`წავშალო "${video.name}"?`);
            if (!ok) return;
            await deleteVideo(video.id);
            URL.revokeObjectURL(url);
            renderVideos();
          };

          actions.append(watchBtn, deleteBtn);
          info.append(title, meta, actions);
          card.append(preview, info);
          grid.append(card);
        });
    }

    input.addEventListener("change", async () => {
      const files = [...input.files];

      for (const file of files) {
        if (!file.type.startsWith("video/")) continue;

        try {
          await addVideo(file);
        } catch (err) {
          alert(
            "ვიდეო ვერ შეინახა. შესაძლოა ფაილი ძალიან დიდია ან ბრაუზერის საცავი შეივსო."
          );
          console.error(err);
        }
      }

      input.value = "";
      renderVideos();
    });

    closePlayer.addEventListener("click", () => {
      player.pause();
      player.removeAttribute("src");
      player.load();
      dialog.close();
    });

    dialog.addEventListener("close", () => {
      player.pause();
      player.removeAttribute("src");
      player.load();
    });

    openDB()
      .then(renderVideos)
      .catch((err) => {
        console.error(err);
        alert("ბრაუზერის ვიდეო საცავის გახსნა ვერ მოხერხდა.");
      });
  </script>
</body>
</html>
